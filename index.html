<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>de Dok Kok</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --porcelain:#FBFAF7;--green:#123B2E;--green-soft:#2E6B55;--wine:#7A1F3D;
  --ink:#1C2320;--muted:#6B7570;--line:#DCD8CF;--card:#FFFFFF;
  --bg:var(--porcelain);--fg:var(--ink);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --porcelain:#111614;--green:#8FD3B6;--green-soft:#6FBC9C;--wine:#E58BA8;
    --ink:#ECEAE4;--muted:#9AA39E;--line:#2A322E;--card:#191F1C;
  }
}
:root[data-theme="dark"]{
  --porcelain:#111614;--green:#8FD3B6;--green-soft:#6FBC9C;--wine:#E58BA8;
  --ink:#ECEAE4;--muted:#9AA39E;--line:#2A322E;--card:#191F1C;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Karla,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:20px 18px 64px}
h1,h2,h3{font-family:Fraunces,Georgia,"Times New Roman",serif;font-weight:600;line-height:1.15;margin:0}
button{font:inherit;cursor:pointer}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}
.brand{font-family:Fraunces,Georgia,serif;font-size:26px;font-weight:600;letter-spacing:-.01em}
.brand em{font-style:italic;color:var(--green-soft)}
.switch{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.switch[hidden]{display:none}
.switch button{border:0;background:none;color:var(--muted);padding:7px 13px;font-size:13px;font-weight:500}
.switch button[aria-pressed="true"]{background:var(--green);color:var(--card)}
.lede{color:var(--muted);margin:2px 0 26px;max-width:52ch}
.dinner,.admin-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.dinner.full{opacity:.75}
.dinner h2,.admin-card h2{font-size:21px}
.when{color:var(--green-soft);font-weight:700;font-size:13px;letter-spacing:.02em;margin-bottom:5px}
.meta{color:var(--muted);font-size:14px;margin:6px 0 0}
.closed-tag{display:inline-block;background:var(--line);color:var(--muted);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;margin-bottom:6px}
.table-row{display:flex;gap:9px;margin:16px 0 4px;flex-wrap:wrap}
.seat{width:40px;text-align:center}
.plate{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--card)}
.plate.taken{background:var(--green);border-color:var(--green)}
.plate.me{background:var(--wine);border-color:var(--wine)}
.plate.plusone{opacity:.72}
.seat span{display:block;font-size:10px;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{font-size:14px;color:var(--muted);margin-top:10px}
.btn{border:0;border-radius:10px;background:var(--green);color:var(--porcelain);padding:12px 18px;font-weight:700;font-size:15px;margin-top:12px;width:100%}
.btn.ghost{background:transparent;color:var(--green);border:1.5px solid var(--green)}
.btn.danger{background:transparent;color:var(--wine);border:1.5px solid var(--wine)}
.btn:disabled{background:var(--line);color:var(--muted);border-color:var(--line);cursor:not-allowed}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,.chip:focus-visible,.link-danger:focus-visible,.link-ok:focus-visible,.switch button:focus-visible,.qpickdel:focus-visible{outline:2.5px solid var(--wine);outline-offset:2px}
label{display:block;font-size:14px;font-weight:700;margin:16px 0 6px}
textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg);font:inherit;resize:vertical;min-height:62px}
input[type=text],input[type=date],input[type=password]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg);font:inherit}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:8px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--porcelain)}
.chip.wide{width:100%;text-align:center;padding:12px}
.chip:disabled{opacity:.45;cursor:not-allowed}
.sheet{position:fixed;inset:0;background:rgba(10,16,13,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet[hidden]{display:none}
.sheet-inner{background:var(--card);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:22px 18px calc(28px + env(safe-area-inset-bottom,0px))}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.close{border:0;background:none;color:var(--muted);font-size:24px;line-height:1;padding:0 4px}
.done{text-align:center;padding:14px 0}
.done .mark{font-size:40px;color:var(--green-soft)}
.row2{display:flex;gap:10px}
.row2 .btn{flex:1}
.guest{border-top:1px solid var(--line);padding:11px 0;font-size:14px}
.guest:first-of-type{border-top:0}
.guest-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.guest .diet{color:var(--wine);display:block;font-size:13px}
.guest .ans{color:var(--muted);display:block;font-size:13px}
.quote{display:block;font-size:13px;color:var(--fg);font-style:italic;margin-top:4px}
.tag{display:inline-block;background:var(--line);color:var(--muted);border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;font-style:normal;vertical-align:middle}
.link-danger{border:0;background:none;color:var(--wine);font-size:13px;font-weight:500;padding:2px 0;text-decoration:underline;text-underline-offset:3px}
.link-ok{border:0;background:none;color:var(--green-soft);font-size:13px;font-weight:700;padding:2px 0;text-decoration:underline;text-underline-offset:3px;margin-right:10px}
.qcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.qcard b{font-size:14px}
.qpickrow{display:flex;gap:8px;align-items:stretch;margin-bottom:8px}
.qpickrow .qpickbtn{flex:1;margin-bottom:0}
.qpickdel{border:1.5px solid var(--line);background:transparent;color:var(--wine);border-radius:10px;width:42px;flex:0 0 42px;font-size:20px;line-height:1}
.qpickbtn{display:block;width:100%;text-align:left;border:1.5px dashed var(--line);background:transparent;color:var(--fg);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.qpickbtn b{display:block;font-size:14px}
.qpickbtn:hover,.qpickbtn:focus-visible{border-color:var(--green);border-style:solid}
.tally{font-size:14px;color:var(--muted);margin:10px 0 0}
.tally b{color:var(--fg)}
.qline{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.suggest{border-left:3px solid var(--wine);padding:2px 0 2px 13px;margin-top:14px}
.suggest p{margin:0 0 6px;font-size:14px}
.small{font-size:13px;color:var(--muted)}
.statrow{border-top:1px solid var(--line);padding:10px 0}
.statrow:first-child{border-top:0}
.statname{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bar{display:block;height:6px;background:var(--line);border-radius:999px;margin:6px 0 5px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--green-soft);border-radius:999px}
.divider{height:1px;background:var(--line);margin:18px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--green);color:var(--porcelain);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:500;z-index:40;max-width:90vw;display:flex;align-items:center}
.toast.bad{background:var(--wine)}
.toast[hidden]{display:none}
.spinner{color:var(--muted);font-size:14px;padding:30px 0;text-align:center}
@media (prefers-reduced-motion:no-preference){.plate{transition:background .25s ease,border-color .25s ease}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">de Dok <em>Kok</em></div>
    <div class="switch" id="switch" hidden>
      <button id="tabGuest" aria-pressed="true">Gasten</button>
      <button id="tabAdmin" aria-pressed="false">Admin</button>
    </div>
  </header>
  <p class="lede" id="lede"></p>
  <main id="view"><div class="spinner">Even laden…</div></main>
</div>
<div class="sheet" id="sheet" hidden><div class="sheet-inner" id="sheetInner"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";

/* ============================================================
   INSTELLINGEN — vul deze drie regels in
   ============================================================ */
const SUPABASE_URL = "https://lqkcoiiwkfkaxoniahra.supabase.co";
const SUPABASE_KEY = "sb_publishable_PWWvyJL0TExAHsrM8E-qPQ_rEOXlHsO";
const NTFY_TOPIC   = "";   // bijv. "dokkok-7h3k2" — leeg laten = geen meldingen
/* ========================================================== */

const DEVKEY = "dokkok.device", PWKEY = "dokkok.pw";
let deviceToken = "";
try{
  deviceToken = localStorage.getItem(DEVKEY) || "";
  if(!deviceToken){
    deviceToken = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
    localStorage.setItem(DEVKEY, deviceToken);
  }
}catch(e){ deviceToken = String(Date.now()) + Math.random(); }

let adminPw = "";
try{ adminPw = sessionStorage.getItem(PWKEY) || ""; }catch(e){}

async function api(fn, args){
  const res = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + fn, {
    method: "POST",
    headers: {"Content-Type":"application/json", "apikey":SUPABASE_KEY},
    body: JSON.stringify(args || {})
  });
  const text = await res.text();
  let data = null;
  try{ data = text ? JSON.parse(text) : null; }catch(e){ data = text; }
  if(!res.ok){
    const msg = (data && (data.message || data.hint)) || "Er ging iets mis";
    throw new Error(msg);
  }
  return data;
}

async function notify(title, body){
  if(!NTFY_TOPIC) return;
  try{
    await fetch("https://ntfy.sh/" + NTFY_TOPIC, {method:"POST", body: body,
      headers:{"Title": title, "Tags":"fork_and_knife"}});
  }catch(e){}
}

/* ---------- gedeelde hulpjes ---------- */

const el = document.getElementById("view");
const sheet = document.getElementById("sheet");
const sheetInner = document.getElementById("sheetInner");
const toastEl = document.getElementById("toast");
let toastTimer = null, undoAction = null;

const esc = s => String(s==null?"":s).replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const fmt = s => { try{ return new Date(s+"T12:00:00").toLocaleDateString("nl-NL",{weekday:"long",day:"numeric",month:"long"}); }catch(e){ return s; } };
const fmtShort = s => { try{ return new Date(s+"T12:00:00").toLocaleDateString("nl-NL",{day:"numeric",month:"short"}); }catch(e){ return s; } };

function toast(msg, undoLabel, bad){
  toastEl.className = "toast" + (bad ? " bad" : "");
  toastEl.innerHTML = '<span>'+esc(msg)+'</span>' + (undoLabel ? '<button class="undo" data-undo="1" style="border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;margin-left:14px;padding:0">'+esc(undoLabel)+'</button>' : '');
  toastEl.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ toastEl.hidden = true; undoAction = null; }, undoLabel ? 7000 : 3600);
}
const oops = e => toast(e && e.message ? e.message : "Er ging iets mis", null, true);

let pendingConfirm = null;
function ask(question, detail, confirmLabel, fn){
  pendingConfirm = fn;
  sheetInner.innerHTML = '<div class="sheet-head"><h2>'+esc(question)+'</h2><button class="close" data-close>&times;</button></div>'
    + (detail ? '<p class="small" style="margin-top:8px">'+esc(detail)+'</p>' : '')
    + '<div class="row2" style="margin-top:6px"><button class="btn ghost" data-close>Annuleren</button>'
    + '<button class="btn danger" data-confirm>'+esc(confirmLabel)+'</button></div>';
  sheet.hidden = false;
}
function closeSheet(){ sheet.hidden = true; pendingConfirm = null; }
function busy(btn, on, label){
  if(!btn) return;
  btn.disabled = on;
  if(on){ btn.dataset.label = btn.textContent; btn.textContent = label || "Bezig…"; }
  else if(btn.dataset.label){ btn.textContent = btn.dataset.label; }
}

/* ---------- gastenkant ---------- */

let dinners = [];

async function loadGuest(){
  try{
    dinners = await api("app_public_state", {token: deviceToken}) || [];
    renderGuest();
  }catch(e){
    el.innerHTML = '<div class="dinner"><h2>Even niet bereikbaar</h2><p class="meta">'+esc(e.message)+'</p>'
      + '<button class="btn" data-retry="1">Opnieuw proberen</button></div>';
  }
}

function plates(d){
  const slots = [];
  (d.guests||[]).forEach(g => {
    slots.push({label:g.name, letter:g.name.charAt(0), mine:g.mine, extra:false});
    if(g.size === 2) slots.push({label:g.name+" +1", letter:"+1", mine:g.mine, extra:true});
  });
  let h = '<div class="table-row">';
  for(let i=0;i<(d.capacity||6);i++){
    const s = slots[i];
    h += '<div class="seat"><div class="plate '+(s ? (s.mine?"me":"taken") : "")+(s&&s.extra?" plusone":"")+'">'
       + (s ? esc(s.letter) : "") + '</div><span>' + (s ? esc(s.label) : "&nbsp;") + '</span></div>';
  }
  return h + '</div>';
}

const unanswered = (d, answers) => (d.questions||[]).filter(q => !(answers||{})[q.id]);

function renderGuest(){
  document.getElementById("lede").textContent = "Zes plekken per avond. Kies een datum, laat weten wat je niet eet, en je hoort van me via WhatsApp.";
  if(!dinners.length){
    el.innerHTML = '<div class="dinner"><h2>Nog geen datum open</h2><p class="meta">Zodra er een avond gepland staat, verschijnt die hier.</p></div>';
    return;
  }
  el.innerHTML = dinners.map(d => {
    const free = (d.capacity||6) - (d.seatsUsed||0);
    const my = d.my;
    let action, extra = "";
    if(my && (d.questions||[]).length){
      const open = unanswered(d, my.answers).length;
      extra = '<button class="btn ghost" data-answer="'+d.id+'">'
        + (open ? (open===1 ? "Nog een vraag voor je" : "Nog "+open+" vragen voor je") : "Je antwoorden aanpassen") + '</button>';
    }
    if(my && my.status === "seated") action = '<button class="btn ghost" disabled>Je staat op de lijst'+(my.size===2?", met +1":"")+'</button>';
    else if(my) action = '<button class="btn ghost" disabled>Op de wachtlijst, plek '+my.position+'</button>';
    else if(!d.open) action = '<button class="btn" disabled>Inschrijving gesloten</button>';
    else if(free > 0) action = '<button class="btn" data-join="'+d.id+'">Schrijf je in</button>';
    else action = '<button class="btn ghost" data-wait="'+d.id+'">Zet me op de wachtlijst</button>';
    return '<article class="dinner'+(free?"":" full")+'">'
      + (d.open ? "" : '<div class="closed-tag">Gesloten</div>')
      + '<div class="when">'+fmt(d.date)+' &middot; '+esc(d.time)+'</div>'
      + '<h2>'+esc(d.title)+'</h2><p class="meta">'+esc(d.place)+'</p>'
      + plates(d)
      + '<p class="count">'+(free ? free+(free===1?" plek":" plekken")+" vrij" : "De tafel is vol"+(d.waitCount?" — "+d.waitCount+" op de wachtlijst":""))+'</p>'
      + action + extra + '</article>';
  }).join("");
}

function questionField(q, answers){
  const val = (answers||{})[q.id] || "";
  if(q.type === "open"){
    return '<label for="qo_'+esc(q.id)+'">'+esc(q.text)+'</label>'
      + '<textarea id="qo_'+esc(q.id)+'" data-qopen="'+esc(q.id)+'" rows="2" placeholder="In je eigen woorden">'+esc(val)+'</textarea>';
  }
  return '<label>'+esc(q.text)+'</label><div class="chips" data-q="'+esc(q.id)+'">'
    + (q.options||[]).map(o => '<button type="button" class="chip" aria-pressed="'+(val===o?"true":"false")+'" data-opt="'+esc(o)+'">'+esc(o)+'</button>').join("")
    + '</div>';
}
function suggestField(val){
  return '<label for="ideaBox">Heb je een suggestie?</label>'
    + '<textarea id="ideaBox" rows="2" placeholder="Een gerecht, een wens, iets wat je nog nooit at">'+esc(val||"")+'</textarea>'
    + '<p class="hint">Helemaal vrij in te vullen. Ik beloof niets, maar ik lees alles.</p>';
}
function collectAnswers(){
  const answers = {};
  sheetInner.querySelectorAll("[data-q]").forEach(g => {
    const p = g.querySelector('[aria-pressed="true"]');
    if(p) answers[g.dataset.q] = p.dataset.opt;
  });
  sheetInner.querySelectorAll("[data-qopen]").forEach(t => {
    const v = t.value.trim(); if(v) answers[t.dataset.qopen] = v;
  });
  return answers;
}

const findDinner = id => dinners.find(x => String(x.id) === String(id));

function openForm(id, mode){
  const d = findDinner(id); if(!d) return;
  const free = (d.capacity||6) - (d.seatsUsed||0);
  const canPlusOne = mode === "wait" || free >= 2;
  sheetInner.innerHTML =
      '<div class="sheet-head"><div><div class="when">'+fmt(d.date)+'</div><h2>'+esc(d.title)+'</h2></div>'
    + '<button class="close" data-close>&times;</button></div>'
    + (mode === "wait" ? '<p class="hint" style="margin-top:8px">De tafel is vol. Valt er iemand af, dan schuif je door en hoor je het van me.</p>' : '')
    + '<label for="nm">Je voornaam</label><input id="nm" type="text" autocomplete="given-name" placeholder="Zo sta je op de lijst">'
    + '<label>Kom je alleen?</label><div class="chips" id="sizePick">'
    + '<button type="button" class="chip" aria-pressed="true" data-size="1">Alleen ik</button>'
    + '<button type="button" class="chip" aria-pressed="false" data-size="2"'+(canPlusOne?"":" disabled")+'>Ik neem iemand mee</button></div>'
    + (canPlusOne ? "" : '<p class="hint">Er is nog maar één plek vrij, dus +1 kan hier niet meer.</p>')
    + '<label for="dt">Wat eten jullie niet?</label><input id="dt" type="text" placeholder="Allergie, vegetarisch, of laat leeg">'
    + '<p class="hint">Kom je met zijn tweeën, geef dan voor jullie allebei door wat er niet in kan. Alleen ik zie dit; andere gasten zien alleen je voornaam.</p>'
    + (d.questions||[]).map(q => questionField(q, {})).join("")
    + (d.suggest ? suggestField("") : "")
    + '<button class="btn" data-save="'+d.id+'">'+(mode === "wait" ? "Op de wachtlijst" : "Plek reserveren")+'</button>';
  sheet.hidden = false;
  setTimeout(()=>{ const n = document.getElementById("nm"); if(n) n.focus(); }, 50);
}

async function submitForm(id, btn){
  const d = findDinner(id); if(!d) return;
  const name = document.getElementById("nm").value.trim();
  if(!name){ document.getElementById("nm").focus(); return toast("Vul je voornaam in.", null, true); }
  const sb = sheetInner.querySelector('#sizePick [aria-pressed="true"]');
  const size = sb ? Number(sb.dataset.size) : 1;
  const box = document.getElementById("ideaBox");
  busy(btn, true);
  try{
    const r = await api("app_join", {
      p_dinner: d.id, p_name: name, p_diet: document.getElementById("dt").value.trim(),
      p_size: size, p_answers: collectAnswers(), p_idea: box ? box.value.trim() : "", p_token: deviceToken
    });
    notify("Nieuwe inschrijving — " + d.title,
           name + (size===2?" (+1)":"") + " voor " + fmt(d.date) + (r.status==="waiting"?" — wachtlijst":""));
    if(r.status === "waiting"){
      sheetInner.innerHTML = '<div class="done"><div class="mark">&#9998;</div><h2>Je staat op de wachtlijst</h2>'
        + '<p class="small">Plek '+r.position+' voor '+fmt(d.date)+'.</p>'
        + '<p class="small">Valt er iemand af, dan app ik je.</p>'
        + '<button class="btn" data-close>Klaar</button></div>';
    } else {
      sheetInner.innerHTML = '<div class="done"><div class="mark">&#10003;</div><h2>'+(size===2?"Jullie zitten aan tafel":"Je zit aan tafel")+'</h2>'
        + '<p class="small">'+fmt(d.date)+', '+esc(d.time)+' — '+esc(d.place)+'</p>'
        + '<p class="small">Ik heb een seintje gekregen en app je binnenkort ter bevestiging.</p>'
        + '<button class="btn" data-close>Klaar</button></div>';
    }
    await loadGuest();
  }catch(e){ busy(btn, false); oops(e); }
}

function openAnswers(id){
  const d = findDinner(id); if(!d || !d.my) return;
  const open = unanswered(d, d.my.answers);
  const heading = open.length ? (open.length === 1 ? "Nog een vraag" : "Nog " + open.length + " vragen") : "Je antwoorden";
  sheetInner.innerHTML = '<div class="sheet-head"><div><div class="when">'+fmt(d.date)+'</div><h2>'+esc(heading)+'</h2></div>'
    + '<button class="close" data-close>&times;</button></div>'
    + '<p class="hint" style="margin-top:8px">'
    + (open.length ? "Deze " + (open.length===1?"vraag kwam":"vragen kwamen") + " er later bij." : "Van gedachten veranderd? Pas ze gerust aan.")
    + ' Je plek blijft gewoon staan.</p>'
    + (d.questions||[]).map(q => questionField(q, d.my.answers)).join("")
    + (d.suggest ? suggestField(d.my.idea) : "")
    + '<button class="btn" data-saveanswers="'+d.id+'">Antwoorden opslaan</button>';

}

let adm = null, draftQs = [], draftOpen = false, draftSuggest = false;

function askPassword(){
  sheetInner.innerHTML = '<div class="sheet-head"><h2>Admin</h2><button class="close" data-close>&times;</button></div>'

async function loadAdmin(){
  if(!adminPw){ el.innerHTML = '<div class="admin-card"><h2>Admin</h2><p class="small">Log in om verder te gaan.</p><button class="btn" data-loginopen="1">Inloggen</button></div>'; return; }
  el.innerHTML = '<div class="spinner">Even laden…</div>';
  try{
    adm = await api("admin_state", {pw: adminPw});
    renderAdmin();
  }catch(e){
    adminPw = ""; try{ sessionStorage.removeItem(PWKEY); }catch(x){}

const admDinner = id => (adm.dinners||[]).find(x => String(x.id) === String(id));
const seatsFree = d => (adm.capacity||6) - (d.seatsUsed||0);

function tally(d,q){
  if(q.type === "open"){
    const said = (d.guests||[]).filter(g => g.answers[q.id]);
    if(!said.length) return "nog geen antwoorden";
    return said.map(g => '<span class="quote">'+esc(g.name)+': “'+esc(g.answers[q.id])+'”</span>').join("");
  }
  const c = {};
  (d.guests||[]).forEach(g => { const a = g.answers[q.id]; if(a) c[a] = (c[a]||0)+1; });
  const parts = Object.keys(c).map(k => '<b>'+c[k]+'&times;</b> '+esc(k));
  return parts.length ? parts.join(" &middot; ") : "nog geen antwoorden";
}

function ideas(d){
  if(!d.guests.length) return ["Nog niemand ingeschreven. Zodra de eerste antwoorden binnen zijn, zie je hier suggesties."];
  const out = [];
  const diets = d.guests.filter(g => g.diet).map(g => g.name + ": " + g.diet);
  const veg = d.guests.filter(g => /veget|vegan|plant/i.test(g.diet)).length;
  const allerg = d.guests.filter(g => /allerg|noten|gluten|lactose/i.test(g.diet)).length;
  const answered = d.guests.filter(g => Object.keys(g.answers).length).length;
  const plusones = d.guests.filter(g => g.size === 2).length;
  const ideaCount = d.guests.filter(g => g.idea).length;
  if(veg) out.push("Maak het hoofdgerecht vegetarisch en zet vlees er los bij — dan hoef je niet twee keer te koken.");
  if(allerg) out.push("Let op allergieën bij het toetje; daar komen noten en lactose het vaakst stiekem terug.");
  if(plusones) out.push(plusones + " gast" + (plusones>1?"en nemen":" neemt") + " iemand mee die de poll niet apart heeft ingevuld.");
  if(diets.length) out.push("Onthouden bij de boodschappen: " + diets.join(", ") + ".");
  if(ideaCount) out.push(ideaCount + (ideaCount>1?" gasten hebben":" gast heeft") + " een suggestie achtergelaten.");
  if(answered < d.guests.length) out.push((d.guests.length - answered) + " van de " + d.guests.length + " gasten hebben de poll niet ingevuld.");
  const free = seatsFree(d);
  if(free > 0) out.push("Nog " + free + (free===1?" plek":" plekken") + " vrij — wacht met de boodschappenlijst tot een week van tevoren.");
  return out;
}

function renderAdmin(){

  const cards = (adm.dinners||[]).map(d => {

    return '<section class="admin-card">'
      + (d.open ? "" : '<div class="closed-tag">Gesloten</div>')
      + '<div class="when">'+fmt(d.date)+' &middot; '+esc(d.time)+'</div>'
      + '<h2>'+esc(d.title)+'</h2>'
      + '<p class="meta">'+(d.seatsUsed||0)+' van '+(adm.capacity||6)+' plekken bezet'+(d.waitlist.length?" &middot; "+d.waitlist.length+" op de wachtlijst":"")+'</p>'
      + '<div class="divider"></div>'
      + (d.guests.length
          ? d.guests.map(g => '<div class="guest"><div class="guest-row"><b>'+esc(g.name)+(g.size===2?' <span class="small">+1</span>':'')+'</b>'
              + '<button class="link-danger" data-del="'+g.id+'">Verwijderen</button></div>'

              + (g.idea ? '<span class="quote">Suggestie: “'+esc(g.idea)+'”</span>' : '')+'</div>').join("")
          : '<p class="small">Nog niemand ingeschreven.</p>')
      + (free > 0 ? '<button class="btn ghost" data-addguest="'+d.id+'">Gast zelf toevoegen</button>' : '')
      + '<div class="divider"></div><h3 style="font-size:16px">Poll</h3>'
      + ((d.questions||[]).length
          ? d.questions.map((q,qi) => '<div class="tally"><div class="qline"><span>'+esc(q.text)+(q.type==="open"?' <span class="tag">open</span>':'')+'</span>'
              + '<button class="link-danger" data-delq="'+d.id+':'+qi+'">Weg</button></div>'+tally(d,q)+'</div>').join("")
          : '<p class="small">Nog geen vragen.</p>')

          ? '<div class="divider"></div><h3 style="font-size:16px">Wachtlijst</h3>'
            + d.waitlist.map((g,i) => '<div class="guest"><div class="guest-row"><b>'+(i+1)+'. '+esc(g.name)+(g.size===2?' <span class="small">+1</span>':'')+'</b><span>'
                + (free >= g.size ? '<button class="link-ok" data-promote="'+g.id+'">Naar tafel</button>' : '')
                + '<button class="link-danger" data-del="'+g.id+'">Verwijderen</button></span></div>'
                + (g.diet ? '<span class="diet">'+esc(g.diet)+'</span>' : '')
                + (g.idea ? '<span class="quote">Suggestie: “'+esc(g.idea)+'”</span>' : '')+'</div>').join("")
            + (free === 0 ? '<p class="small">Haal eerst iemand van de tafel om door te kunnen schuiven.</p>' : '')
          : '')
      + (d.suggest ? (function(){
          const ids = d.guests.filter(g => g.idea);
          return '<div class="divider"></div><h3 style="font-size:16px">Suggesties van gasten</h3>'
            + (ids.length ? ids.map(g => '<p class="quote">'+esc(g.name)+': “'+esc(g.idea)+'”</p>').join("") : '<p class="small">Nog geen suggesties binnen.</p>');
        })() : '')
      + '<div class="suggest"><h3 style="font-size:16px;margin-bottom:6px">Ideeën</h3>'
      + ideas(d).map(t => '<p>'+esc(t)+'</p>').join("") + '</div>'
      + '<div class="row2"><button class="btn ghost" data-toggleopen="'+d.id+'">'+(d.open ? "Sluiten" : "Heropenen")+'</button>'
      + '<button class="btn danger" data-deldate="'+d.id+'">Verwijderen</button></div></section>';
  }).join("");
  el.innerHTML = (cards || '<div class="admin-card"><h2>Geen datums</h2><p class="small">Zet hieronder je eerste avond open.</p></div>')
    + '<button class="btn" data-adddate="1">Nieuwe datum openzetten</button>'
    + '<button class="btn ghost" data-stats="1">Wie komt er vaak?</button>'
    + '<button class="btn ghost" data-library="1">Vragenbibliotheek beheren ('+(adm.library||[]).length+')</button>';
}

function pickerHTML(){
  const chosen = draftQs.map(q => q.text.trim().toLowerCase());
  const lib = (adm.library||[]).filter(q => chosen.indexOf(q.text.trim().toLowerCase()) === -1);
  return '<div id="qpick">'
    + (draftQs.length
        ? '<label>Vragen voor deze avond</label>'
          + draftQs.map((q,i) => '<div class="qcard"><div class="guest-row"><b>'+esc(q.text)+'</b>'
              + '<button class="link-danger" data-rmdraft="'+i+'">Weghalen</button></div>'
              + '<span class="ans">'+(q.type==="open" ? "open antwoord" : (q.options||[]).map(esc).join(" &middot; "))+'</span></div>').join("")
        : '<p class="hint">Nog geen vragen gekozen. Eén vraag is het minimum.</p>')
    + (lib.length
        ? '<label>Eerder gebruikt</label>'
          + lib.map(q => '<div class="qpickrow"><button type="button" class="qpickbtn" data-libadd="'+esc(q.text)+'">'
              + '<b>'+esc(q.text)+'</b><span class="ans">'+(q.type==="open" ? "open antwoord" : (q.options||[]).map(esc).join(" &middot; "))+'</span></button>'
              + '<button type="button" class="qpickdel" data-libdel="'+esc(q.text)+'" aria-label="'+esc(q.text)+' uit de bibliotheek verwijderen">&times;</button></div>').join("")
        : '')
    + '<label for="qt">Nieuwe vraag</label><input id="qt" type="text" placeholder="Bijv. Bak jij het toetje?">'
    + '<div class="chips" id="qType" style="margin-top:8px">'
    + '<button type="button" class="chip" aria-pressed="'+(draftOpen?"false":"true")+'" data-qtype="choice">Vaste antwoorden</button>'
    + '<button type="button" class="chip" aria-pressed="'+(draftOpen?"true":"false")+'" data-qtype="open">Open antwoord</button></div>'
    + (draftOpen
        ? '<p class="hint">Gasten typen zelf.</p>'
        : '<input id="qo" type="text" placeholder="Ja, Nee, Misschien" style="margin-top:8px"><p class="hint">Scheid de antwoorden met een komma.</p>')
    + '<button type="button" class="btn ghost" data-addcustom="1">Vraag toevoegen aan de lijst</button></div>';
}
function refreshPicker(){ const b = document.getElementById("qpick"); if(b) b.outerHTML = pickerHTML(); }

async function addCustom(){
  const ti = document.getElementById("qt");
  const text = ti.value.trim();
  if(!text){ ti.focus(); return toast("Vul de vraag in.", null, true); }
  let opts = [];
  if(!draftOpen){
    const oi = document.getElementById("qo");
    opts = oi.value.split(",").map(x => x.trim()).filter(Boolean);
    if(opts.length < 2){ oi.focus(); return toast("Geef minstens twee antwoorden.", null, true); }
  }
  const type = draftOpen ? "open" : "choice";
  draftQs.push({text:text, options:opts, type:type});
  draftOpen = false;
  refreshPicker();
  try{
    await api("admin_library_add", {pw: adminPw, p_text: text, p_options: opts, p_type: type});
    adm.library = (adm.library||[]).filter(q => q.text !== text).concat([{text:text, options:opts, type:type}]);
  }catch(e){ oops(e); }
}

function openStats(){
  const list = adm.stats || [];
  const max = list.length ? list[0].times : 1;
  const regulars = list.filter(p => p.times > 1).length;
  const seatTotal = (adm.dinners||[]).reduce((n,d) => n + (d.seatsUsed||0), 0);
  sheetInner.innerHTML = '<div class="sheet-head"><div><h2>Wie komt er vaak?</h2>'
    + '<p class="small">Over '+(adm.dinners||[]).length+' avonden, '+seatTotal+' plekken bezet.</p></div>'
    + '<button class="close" data-close>&times;</button></div>'
    + (list.length
        ? '<p class="small" style="margin-top:10px">'+list.length+' verschillende namen, waarvan '+regulars+' meer dan één keer.</p><div style="margin-top:14px">'
          + list.map(p => '<div class="statrow"><div class="statname"><b>'+esc(p.name)+'</b>'
              + '<span class="small">'+p.times+'&times;'+(p.seats > p.times ? ' &middot; '+p.seats+' plekken' : '')+(p.ideas?' &middot; '+p.ideas+' suggestie'+(p.ideas>1?"s":""):'')+'</span></div>'
              + '<div class="bar"><span style="width:'+Math.round(p.times/max*100)+'%"></span></div>'
              + '<span class="small">'+(p.dates||[]).map(fmtShort).join(", ")+'</span></div>').join("") + '</div>'
        : '<p class="hint" style="margin-top:12px">Nog geen inschrijvingen.</p>')
    + '<button class="btn" data-close>Klaar</button>';
  sheet.hidden = false;
}

/* ---------- interactie ---------- */

document.addEventListener("click", async function(e){
  const t = e.target.closest("button");
  if(!t) return;
  const ds = t.dataset;

  if(ds.close !== undefined || t.classList.contains("close")){ closeSheet(); return; }
  if(ds.confirm !== undefined){ const fn = pendingConfirm; closeSheet(); if(fn) fn(); return; }
  if(ds.undo !== undefined){ const fn = undoAction; undoAction = null; toastEl.hidden = true; if(fn) fn(); return; }
  if(ds.retry !== undefined){ loadGuest(); return; }

  if(ds.opt !== undefined){
    const was = t.getAttribute("aria-pressed") === "true";
    t.parentElement.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed","false"));
    t.setAttribute("aria-pressed", was ? "false" : "true");
    return;
  }
  if(ds.size !== undefined){
    t.parentElement.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed","false"));
    t.setAttribute("aria-pressed","true"); return;
  }

  // --- gasten ---
  if(ds.join){ openForm(ds.join, "join"); return; }
  if(ds.wait){ openForm(ds.wait, "wait"); return; }
  if(ds.save){ submitForm(ds.save, t); return; }
  if(ds.answer){ openAnswers(ds.answer); return; }
  if(ds.saveanswers){
    const d = findDinner(ds.saveanswers); if(!d) return;
    const box = document.getElementById("ideaBox");
    busy(t, true);
    try{
      await api("app_update_answers", {p_dinner: d.id, p_token: deviceToken,
        p_answers: collectAnswers(), p_idea: box ? box.value.trim() : ""});
      closeSheet(); await loadGuest(); toast("Bedankt, ik heb het erbij gezet.");
    }catch(err){ busy(t, false); oops(err); }
    return;
  }

  // --- inloggen ---
  if(ds.loginopen !== undefined){ askPassword(); return; }
  if(ds.login !== undefined){
    const pw = document.getElementById("pw").value;
    busy(t, true);
    try{
      await api("admin_check", {pw: pw});
      adminPw = pw; try{ sessionStorage.setItem(PWKEY, pw); }catch(x){}
      closeSheet(); await loadAdmin();
    }catch(err){ busy(t, false); oops(err); }
    return;
  }

  // --- vragenkiezer ---
  if(ds.libadd !== undefined){
    const q = (adm.library||[]).find(x => x.text === ds.libadd);
    if(q) draftQs.push({text:q.text, options:(q.options||[]).slice(), type:q.type});
    refreshPicker(); return;
  }
  if(ds.rmdraft !== undefined){ draftQs.splice(Number(ds.rmdraft),1); refreshPicker(); return; }
  if(ds.addcustom !== undefined){ addCustom(); return; }
  if(ds.qtype !== undefined){
    const keep = document.getElementById("qt").value;
    draftOpen = ds.qtype === "open"; refreshPicker();
    document.getElementById("qt").value = keep; return;
  }
  if(ds.suggesttoggle !== undefined){
    draftSuggest = !draftSuggest;
    t.setAttribute("aria-pressed", draftSuggest ? "true" : "false");
    t.textContent = draftSuggest ? "Suggestieveld staat aan" : "Suggestieveld toevoegen";
    return;
  }
  if(ds.libdel !== undefined){
    const text = ds.libdel;
    const removed = (adm.library||[]).find(q => q.text === text);
    adm.library = (adm.library||[]).filter(q => q.text !== text);
    refreshPicker();
    try{ await api("admin_library_delete", {pw: adminPw, p_text: text}); }catch(err){ return oops(err); }
    undoAction = async function(){
      try{ await api("admin_library_add", {pw: adminPw, p_text: removed.text, p_options: removed.options, p_type: removed.type});
        adm.library = (adm.library||[]).concat([removed]); refreshPicker(); toast("Weer in de bibliotheek.");
      }catch(err){ oops(err); }
    };
    toast("“"+text+"” weg uit de bibliotheek.", "Ongedaan maken");
    return;
  }

  // --- admin ---
  if(ds.del){
    ask("Inschrijving verwijderen?", "Dit kun je niet terugdraaien.", "Verwijderen", async function(){
      try{ await api("admin_delete_signup", {pw: adminPw, p_id: ds.del}); await loadAdmin(); toast("Verwijderd."); }
      catch(err){ oops(err); }
    });
    return;
  }
  if(ds.promote){
    try{ await api("admin_promote", {pw: adminPw, p_id: ds.promote}); await loadAdmin(); toast("Doorgeschoven naar tafel."); }
    catch(err){ oops(err); }
    return;
  }
  if(ds.delq){
    const p = ds.delq.split(":"), d = admDinner(p[0]), i = Number(p[1]);
    if(!d || !d.questions[i]) return;
    const q = d.questions[i];
    ask("Vraag verwijderen?", "“"+q.text+"” verdwijnt bij deze avond.", "Verwijderen", async function(){
      const qs = d.questions.slice(); qs.splice(i,1);
      try{ await api("admin_update_dinner", {pw: adminPw, p_id: d.id, patch: {questions: qs}}); await loadAdmin(); toast("Vraag verwijderd."); }
      catch(err){ oops(err); }
    });
    return;
  }
  if(ds.deldate){
    const d = admDinner(ds.deldate); if(!d) return;
    const n = d.guests.length + d.waitlist.length;
    ask("“"+d.title+"” verwijderen?", n ? n + " inschrijving(en) verdwijnen mee." : "Er heeft zich nog niemand ingeschreven.", "Verwijderen", async function(){
      try{ await api("admin_delete_dinner", {pw: adminPw, p_id: d.id}); await loadAdmin(); toast("Datum verwijderd."); }
      catch(err){ oops(err); }
    });
    return;
  }
  if(ds.toggleopen){
    const d = admDinner(ds.toggleopen); if(!d) return;
    try{ await api("admin_update_dinner", {pw: adminPw, p_id: d.id, patch: {open: !d.open}}); await loadAdmin();
      toast(d.open ? "Inschrijving gesloten." : "Inschrijving weer open."); }
    catch(err){ oops(err); }
    return;
  }
  if(ds.suggestflip){
    const d = admDinner(ds.suggestflip); if(!d) return;
    try{ await api("admin_update_dinner", {pw: adminPw, p_id: d.id, patch: {suggest: !d.suggest}}); await loadAdmin();
      toast(d.suggest ? "Suggestieveld uit." : "Suggestieveld aan."); }
    catch(err){ oops(err); }
    return;
  }
  if(ds.addq){
    const d = admDinner(ds.addq); if(!d) return;
    draftQs = []; draftOpen = false;
    sheetInner.innerHTML = '<div class="sheet-head"><div><h2>Vragen toevoegen</h2><p class="small">'+esc(d.title)+'</p></div>'
      + '<button class="close" data-close>&times;</button></div>'
      + '<p class="hint" style="margin-top:8px">Wie al is ingeschreven ziet de nieuwe vraag zodra hij de link weer opent.</p>'
      + pickerHTML() + '<button class="btn" data-saveq="'+d.id+'">Vragen opslaan</button>';
    sheet.hidden = false; return;
  }
  if(ds.saveq){
    const d = admDinner(ds.saveq); if(!d) return;
    if(!draftQs.length) return toast("Kies of schrijf eerst een vraag.", null, true);
    const qs = (d.questions||[]).concat(draftQs.map((q,i) => ({id:"q_"+Date.now()+"_"+i, text:q.text, options:q.options, type:q.type})));
    busy(t, true);
    try{ await api("admin_update_dinner", {pw: adminPw, p_id: d.id, patch: {questions: qs}});
      closeSheet(); await loadAdmin(); toast("Toegevoegd."); }
    catch(err){ busy(t, false); oops(err); }
    return;
  }
  if(ds.addguest){
    const d = admDinner(ds.addguest); if(!d) return;
    sheetInner.innerHTML = '<div class="sheet-head"><div><h2>Gast toevoegen</h2><p class="small">'+esc(d.title)+'</p></div>'
      + '<button class="close" data-close>&times;</button></div>'
      + '<label for="gn">Voornaam</label><input id="gn" type="text">'
      + '<label>Hoeveel plekken?</label><div class="chips" id="gSize">'
      + '<button type="button" class="chip" aria-pressed="true" data-size="1">Eén</button>'
      + '<button type="button" class="chip" aria-pressed="false" data-size="2"'+(seatsFree(d)>=2?"":" disabled")+'>Twee</button></div>'
      + '<label for="gd">Wat eet die niet?</label><input id="gd" type="text">'
      + '<button class="btn" data-saveguest="'+d.id+'">Aan tafel zetten</button>';
    sheet.hidden = false; return;
  }
  if(ds.saveguest){
    const nm = document.getElementById("gn").value.trim();
    if(!nm){ document.getElementById("gn").focus(); return toast("Vul een voornaam in.", null, true); }
    const sb = sheetInner.querySelector('#gSize [aria-pressed="true"]');
    busy(t, true);
    try{ await api("admin_add_signup", {pw: adminPw, p_dinner: ds.saveguest, p_name: nm,
           p_diet: document.getElementById("gd").value.trim(), p_size: sb ? Number(sb.dataset.size) : 1});
      closeSheet(); await loadAdmin(); toast(nm + " staat aan tafel."); }
    catch(err){ busy(t, false); oops(err); }
    return;
  }
  if(ds.adddate){ openAddDate(); return; }
  if(ds.savedate){
    const date = document.getElementById("ddate").value;
    if(!date){ document.getElementById("ddate").focus(); return toast("Kies een datum.", null, true); }
    if(!draftQs.length) return toast("Stel minstens één vraag voor deze avond.", null, true);
    busy(t, true);
    try{
      await api("admin_add_dinner", {pw: adminPw, payload: {
        title: document.getElementById("dtitle").value.trim() || "Etentje",
        date: date,
        time: document.getElementById("dtime").value.trim() || "19:00",
        place: document.getElementById("dplace").value.trim() || "Bij mij thuis",
        suggest: draftSuggest,
        questions: draftQs.map((q,i) => ({id:"q_"+Date.now()+"_"+i, text:q.text, options:q.options, type:q.type}))
      }});
      closeSheet(); await loadAdmin(); toast("Datum staat open.");
    }catch(err){ busy(t, false); oops(err); }
    return;
  }
  if(ds.stats){ openStats(); return; }
  if(ds.library){
    sheetInner.innerHTML = '<div class="sheet-head"><div><h2>Vragenbibliotheek</h2>'
      + '<p class="small">Wat hier staat, kun je bij elke nieuwe avond hergebruiken.</p></div>'
      + '<button class="close" data-close>&times;</button></div>'
      + '<div id="qpick">' + ((adm.library||[]).length
          ? (adm.library||[]).map(q => '<div class="qpickrow"><div class="qcard" style="flex:1;margin-bottom:0">'
              + '<b>'+esc(q.text)+'</b><span class="ans">'+(q.type==="open"?"open antwoord":(q.options||[]).map(esc).join(" &middot; "))+'</span></div>'
              + '<button type="button" class="qpickdel" data-libdel="'+esc(q.text)+'" aria-label="verwijderen">&times;</button></div>').join("")
          : '<p class="hint">De bibliotheek is leeg.</p>') + '</div>'
      + '<p class="hint">Verwijderen hier haalt de vraag niet weg bij avonden die al lopen.</p>'
      + '<button class="btn" data-close>Klaar</button>';
    sheet.hidden = false; return;
  }
});

sheet.addEventListener("click", e => { if(e.target === sheet) closeSheet(); });
document.addEventListener("keydown", e => { if(e.key === "Escape") closeSheet(); });

const tg = document.getElementById("tabGuest"), ta = document.getElementById("tabAdmin");
tg.addEventListener("click", () => { tg.setAttribute("aria-pressed","true"); ta.setAttribute("aria-pressed","false"); loadGuest(); });
ta.addEventListener("click", () => { ta.setAttribute("aria-pressed","true"); tg.setAttribute("aria-pressed","false"); loadAdmin(); });

// De admintab verschijnt alleen met #admin achter de link.
if(location.hash === "#admin"){
  document.getElementById("switch").hidden = false;
  ta.setAttribute("aria-pressed","true"); tg.setAttribute("aria-pressed","false");
  loadAdmin();
} else {
  loadGuest();
}
</script>
</body>
</html>
